apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: your-registry/your-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: port
            - name: ACCESS_SECRET_TOKEN_EXPIRES_IN
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: access_secret_token_expires_in
            - name: ACCESS_SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: access_secret_token
            - name: REFRESH_SECRET_TOKEN_EXPIRES_IN
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: refresh_secret_token_expires_in
            - name: REFRESH_SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: refresh_secret_token
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: db_username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: db_password
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: db_host
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: db_name
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: db_port
            - name: DB_URL
              value: "postgresql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?schema=public&connect_timeout=300"
          resources:
            requests:
              cpu: "100m"
              memory: "500Mi"
